<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <radialGradient id="core" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1b2440"/><stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <filter id="glo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="420" height="420" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="418" height="418" rx="18" fill="none" stroke="#1f2633"/>

  <g fill="none" stroke="#232b3d" stroke-dasharray="2 8">
    <circle cx="210" cy="210" r="150"><animateTransform attributeName="transform" type="rotate" from="0 210 210" to="360 210 210" dur="40s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="210" r="112"><animateTransform attributeName="transform" type="rotate" from="360 210 210" to="0 210 210" dur="28s" repeatCount="indefinite"/></circle>
  </g>

  <circle cx="210" cy="210" r="58" fill="url(#core)" stroke="#38bdf8" stroke-width="1.6"/>
  <circle cx="210" cy="210" r="66" fill="none" stroke="#38bdf8" stroke-width="1" opacity=".5">
    <animate attributeName="r" values="60;78;60" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;0;.55" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <text x="210" y="206" text-anchor="middle" fill="#c0caf5" font-size="26" font-weight="bold" filter="url(#glo)">RB</text>
  <text x="210" y="228" text-anchor="middle" fill="#565f89" font-size="11">cloud eng</text>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 210 210" to="360 210 210" dur="24s" repeatCount="indefinite"/>

    <g transform="rotate(0 210 60)">
      <animateTransform attributeName="transform" type="rotate" from="0 210 60" to="-360 210 60" dur="24s" repeatCount="indefinite"/>
      <rect x="168" y="46" width="84" height="28" rx="14" fill="#161b22" stroke="#ff9e64"/><text x="210" y="65" text-anchor="middle" fill="#ff9e64" font-size="12">AWS</text>
    </g>
    <g transform="rotate(0 340 135)">
      <animateTransform attributeName="transform" type="rotate" from="0 340 135" to="-360 340 135" dur="24s" repeatCount="indefinite"/>
      <rect x="298" y="121" width="84" height="28" rx="14" fill="#161b22" stroke="#38bdf8"/><text x="340" y="140" text-anchor="middle" fill="#7dcfff" font-size="12">Docker</text>
    </g>
    <g transform="rotate(0 340 285)">
      <animateTransform attributeName="transform" type="rotate" from="0 340 285" to="-360 340 285" dur="24s" repeatCount="indefinite"/>
      <rect x="298" y="271" width="84" height="28" rx="14" fill="#161b22" stroke="#7aa2f7"/><text x="340" y="290" text-anchor="middle" fill="#7aa2f7" font-size="12">K8s</text>
    </g>
    <g transform="rotate(0 210 360)">
      <animateTransform attributeName="transform" type="rotate" from="0 210 360" to="-360 210 360" dur="24s" repeatCount="indefinite"/>
      <rect x="168" y="346" width="84" height="28" rx="14" fill="#161b22" stroke="#bb9af7"/><text x="210" y="365" text-anchor="middle" fill="#bb9af7" font-size="12">Terraform</text>
    </g>
    <g transform="rotate(0 80 285)">
      <animateTransform attributeName="transform" type="rotate" from="0 80 285" to="-360 80 285" dur="24s" repeatCount="indefinite"/>
      <rect x="38" y="271" width="84" height="28" rx="14" fill="#161b22" stroke="#9ece6a"/><text x="80" y="290" text-anchor="middle" fill="#9ece6a" font-size="12">Linux</text>
    </g>
    <g transform="rotate(0 80 135)">
      <animateTransform attributeName="transform" type="rotate" from="0 80 135" to="-360 80 135" dur="24s" repeatCount="indefinite"/>
      <rect x="38" y="121" width="84" height="28" rx="14" fill="#161b22" stroke="#f472b6"/><text x="80" y="140" text-anchor="middle" fill="#f472b6" font-size="12">Python</text>
    </g>
  </g>

</svg>
