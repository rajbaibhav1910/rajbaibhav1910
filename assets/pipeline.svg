<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7"/><stop offset="55%" stop-color="#bb9af7"/><stop offset="100%" stop-color="#9ece6a"/>
    </linearGradient>
    <filter id="glp" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="230" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="898" height="228" rx="18" fill="none" stroke="#1f2633"/>

  <line x1="60" y1="100" x2="880" y2="100" stroke="#1f2633" stroke-width="10" stroke-linecap="round"/>
  <line x1="60" y1="100" x2="880" y2="100" stroke="url(#pipe)" stroke-width="3" stroke-dasharray="10 12" opacity=".7">
    <animate attributeName="stroke-dashoffset" values="0;-44" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <g fill="none" stroke="#2f3a52" stroke-width="2">
    <circle cx="100" cy="100" r="32"/><circle cx="285" cy="100" r="32"/><circle cx="470" cy="100" r="32"/><circle cx="655" cy="100" r="32"/><circle cx="840" cy="100" r="32"/>
  </g>
  <g fill="none" stroke-width="2.4" filter="url(#glp)">
    <circle cx="100" cy="100" r="32" stroke="#7aa2f7" opacity=".12"><animate attributeName="opacity" values=".12;1;1;.12;.12" keyTimes="0;0.03;0.20;0.30;1" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="285" cy="100" r="32" stroke="#bb9af7" opacity=".12"><animate attributeName="opacity" values=".12;1;1;.12;.12" keyTimes="0;0.25;0.42;0.52;1" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="100" r="32" stroke="#38bdf8" opacity=".12"><animate attributeName="opacity" values=".12;1;1;.12;.12" keyTimes="0;0.49;0.66;0.76;1" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="655" cy="100" r="32" stroke="#ff9e64" opacity=".12"><animate attributeName="opacity" values=".12;1;1;.12;.12" keyTimes="0;0.73;0.88;0.94;1" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="100" r="32" stroke="#9ece6a" opacity=".12"><animate attributeName="opacity" values=".12;.12;1;1" keyTimes="0;0.90;0.95;1" dur="9s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#c0caf5" font-size="16" text-anchor="middle">
    <text x="100" y="106">&lt;/&gt;</text>
    <text x="470" y="107">✓</text>
    <text x="655" y="107">▲</text>
  </g>
  <circle cx="285" cy="100" r="14" fill="none" stroke="#bb9af7" stroke-width="3" stroke-dasharray="5 6">
    <animateTransform attributeName="transform" type="rotate" from="0 285 100" to="360 285 100" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M818,104 a10,10 0 0 1 8,-16 a13,13 0 0 1 25,2 a9,9 0 0 1 -2,18 h-27 a10,10 0 0 1 -4,-4 z" fill="none" stroke="#9ece6a" stroke-width="2">
    <animate attributeName="opacity" values=".55;1;.55" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <g fill="#565f89" font-size="12" text-anchor="middle">
    <text x="100" y="152">commit</text><text x="285" y="152">build</text>
    <text x="470" y="152">test</text><text x="655" y="152">deploy</text><text x="840" y="152">live on AWS</text>
  </g>
  <g fill="#38bdf8" font-size="10" text-anchor="middle" opacity=".8">
    <text x="100" y="170">git push</text><text x="285" y="170">docker</text>
    <text x="470" y="170">pytest · lint</text><text x="655" y="170">terraform</text><text x="840" y="170">EKS · ALB</text>
  </g>

  <circle r="7" fill="#f472b6" filter="url(#glp)">
    <animateMotion path="M100,100 H840" dur="9s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;0.25;0.25;0.5;0.5;0.75;0.75;1;1"
      keyTimes="0;0.04;0.20;0.29;0.44;0.53;0.68;0.77;0.92;1"/>
  </circle>

  <text x="34" y="42" fill="#c0caf5" font-size="14">CI/CD pipeline</text>
  <text x="866" y="42" fill="#565f89" font-size="12" text-anchor="end">GitHub Actions → AWS</text>
</svg>
